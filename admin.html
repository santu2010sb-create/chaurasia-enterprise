<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>SHIVAM TOUR & TRAVELS — Cloud Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px}h1{font-size:22px;margin:0 0 4px}.sub{opacity:.8;font-size:13px}
main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px;background:#fff}
button{border:0;border-radius:9px;padding:12px 15px;font-weight:700;font-size:14px;cursor:pointer;margin:6px 5px 0 0;background:#111827;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}.status{padding:11px;border-radius:9px;background:#f3f4f6;margin-top:10px;white-space:pre-wrap;font-size:13px;word-break:break-word}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.hidden{display:none}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
.small{font-size:12px;color:#6b7280}.danger{color:#991b1b}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:19px}}
</style>
</head>
<body>
<header><h1>SHIVAM TOUR & TRAVELS</h1><div class="sub">Cloud Accounting & Management — Android Admin Panel</div></header>
<main>

<section id="loginCard" class="card">
  <h2>Admin Login</h2>
  <p class="small">এই পেজটি Render server থেকেই চালান: <b>/admin</b></p>
  <label>Server</label>
  <input id="api" autocomplete="url">
  <label>Username</label>
  <input id="username" value="admin" autocomplete="username">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div>
    <button onclick="checkServer()">Check Server</button>
    <button onclick="login()">Login & Connect</button>
  </div>
  <div id="loginStatus" class="status">Ready.</div>
</section>

<section id="appCard" class="hidden">
  <div class="card">
    <b id="who"></b>
    <button class="secondary" onclick="logout()">Logout</button>
    <div id="appStatus" class="status">Connected.</div>
  </div>

  <div class="tabs">
    <button onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('customers')">Customers</button>
    <button onclick="showTab('vehicles')">Vehicles</button>
    <button onclick="showTab('bookings')">Bookings</button>
    <button onclick="showTab('invoices')">Invoices</button>
    <button onclick="showTab('payments')">Payments</button>
    <button onclick="showTab('expenses')">Expenses</button>
  </div>

  <div id="dashboard" class="tab card">
    <h2>Dashboard</h2>
    <div class="grid">
      <div class="metric">Sales<b id="mSales">—</b></div>
      <div class="metric">Paid<b id="mPaid">—</b></div>
      <div class="metric">Outstanding<b id="mOutstanding">—</b></div>
      <div class="metric">Expense<b id="mExpense">—</b></div>
      <div class="metric">Profit<b id="mProfit">—</b></div>
    </div>
    <button onclick="loadDashboard()">Refresh Dashboard</button>
  </div>

  <div id="customers" class="tab card hidden">
    <h2>Customers</h2>
    <div class="grid">
      <div><label>Name</label><input id="c_name"></div>
      <div><label>Phone</label><input id="c_phone"></div>
      <div><label>Email</label><input id="c_email"></div>
      <div><label>Address</label><input id="c_address"></div>
    </div>
    <label>Notes</label><textarea id="c_notes"></textarea>
    <button onclick="addRecord('customers',{name:v('c_name'),phone:v('c_phone'),email:v('c_email'),address:v('c_address'),notes:v('c_notes')})">Save Customer</button>
    <button class="secondary" onclick="loadTable('customers')">Refresh</button>
    <div id="customersTable"></div>
  </div>

  <div id="vehicles" class="tab card hidden">
    <h2>Vehicles</h2>
    <div class="grid">
      <div><label>Registration</label><input id="v_reg" placeholder="WB05A7656"></div>
      <div><label>Model</label><input id="v_model" placeholder="Innova Crysta"></div>
      <div><label>Type</label><input id="v_type" placeholder="Taxi"></div>
      <div><label>Driver</label><input id="v_driver"></div>
    </div>
    <label>Notes</label><textarea id="v_notes"></textarea>
    <button onclick="addRecord('vehicles',{reg:v('v_reg'),model:v('v_model'),type:v('v_type'),driver:v('v_driver'),notes:v('v_notes')})">Save Vehicle</button>
    <button class="secondary" onclick="loadTable('vehicles')">Refresh</button>
    <div id="vehiclesTable"></div>
  </div>

  <div id="bookings" class="tab card hidden">
    <h2>Bookings</h2>
    <div class="grid">
      <div><label>Customer ID</label><input id="b_customer_id" type="number"></div>
      <div><label>Vehicle ID</label><input id="b_vehicle_id" type="number"></div>
      <div><label>Date</label><input id="b_date" type="date"></div>
      <div><label>Time</label><input id="b_time" type="time"></div>
      <div><label>Pickup</label><input id="b_pickup"></div>
      <div><label>Drop Location</label><input id="b_drop"></div>
      <div><label>Driver</label><input id="b_driver"></div>
      <div><label>Total</label><input id="b_total" type="number" step="0.01"></div>
      <div><label>Advance</label><input id="b_advance" type="number" step="0.01"></div>
      <div><label>Due</label><input id="b_due" type="number" step="0.01"></div>
      <div><label>Status</label><input id="b_status" value="Booked"></div>
    </div>
    <button onclick="addRecord('bookings',{customer_id:n('b_customer_id'),vehicle_id:n('b_vehicle_id'),date:v('b_date'),time:v('b_time'),pickup:v('b_pickup'),drop_location:v('b_drop'),driver:v('b_driver'),total:n('b_total'),advance:n('b_advance'),due:n('b_due'),status:v('b_status')})">Save Booking</button>
    <button class="secondary" onclick="loadTable('bookings')">Refresh</button>
    <div id="bookingsTable"></div>
  </div>

  <div id="invoices" class="tab card hidden">
    <h2>Invoices</h2>
    <div class="grid">
      <div><label>Invoice No</label><input id="i_no"></div>
      <div><label>Customer ID</label><input id="i_customer_id" type="number"></div>
      <div><label>Booking ID</label><input id="i_booking_id" type="number"></div>
      <div><label>Date</label><input id="i_date" type="date"></div>
      <div><label>Taxable</label><input id="i_taxable" type="number" step="0.01"></div>
      <div><label>CGST</label><input id="i_cgst" type="number" step="0.01"></div>
      <div><label>SGST</label><input id="i_sgst" type="number" step="0.01"></div>
      <div><label>IGST</label><input id="i_igst" type="number" step="0.01"></div>
      <div><label>Total</label><input id="i_total" type="number" step="0.01"></div>
    </div>
    <label>Description</label><textarea id="i_desc"></textarea>
    <button onclick="addRecord('invoices',{invoice_no:v('i_no'),customer_id:n('i_customer_id'),booking_id:n('i_booking_id'),date:v('i_date'),description:v('i_desc'),taxable:n('i_taxable'),cgst:n('i_cgst'),sgst:n('i_sgst'),igst:n('i_igst'),total:n('i_total')})">Save Invoice</button>
    <button class="secondary" onclick="loadTable('invoices')">Refresh</button>
    <div id="invoicesTable"></div>
  </div>

  <div id="payments" class="tab card hidden">
    <h2>Payments</h2>
    <div class="grid">
      <div><label>Invoice ID</label><input id="p_invoice_id" type="number"></div>
      <div><label>Customer ID</label><input id="p_customer_id" type="number"></div>
      <div><label>Date</label><input id="p_date" type="date"></div>
      <div><label>Amount</label><input id="p_amount" type="number" step="0.01"></div>
      <div><label>Mode</label><input id="p_mode" placeholder="Cash / UPI / Bank"></div>
    </div>
    <label>Note</label><textarea id="p_note"></textarea>
    <button onclick="addRecord('payments',{invoice_id:n('p_invoice_id'),customer_id:n('p_customer_id'),date:v('p_date'),amount:n('p_amount'),mode:v('p_mode'),note:v('p_note')})">Save Payment</button>
    <button class="secondary" onclick="loadTable('payments')">Refresh</button>
    <div id="paymentsTable"></div>
  </div>

  <div id="expenses" class="tab card hidden">
    <h2>Expenses</h2>
    <div class="grid">
      <div><label>Vehicle ID</label><input id="e_vehicle_id" type="number"></div>
      <div><label>Date</label><input id="e_date" type="date"></div>
      <div><label>Category</label><input id="e_category"></div>
      <div><label>Amount</label><input id="e_amount" type="number" step="0.01"></div>
    </div>
    <label>Note</label><textarea id="e_note"></textarea>
    <button onclick="addRecord('expenses',{vehicle_id:n('e_vehicle_id'),date:v('e_date'),category:v('e_category'),amount:n('e_amount'),note:v('e_note')})">Save Expense</button>
    <button class="secondary" onclick="loadTable('expenses')">Refresh</button>
    <div id="expensesTable"></div>
  </div>
</section>
</main>

<script>
const DEFAULT_API = location.protocol === 'http:' || location.protocol === 'https:' ? location.origin : 'https://shivam-tour-travels-l740.onrender.com';
let token = sessionStorage.getItem('shivam_token') || '';
const apiInput = document.getElementById('api');
apiInput.value = sessionStorage.getItem('shivam_api') || DEFAULT_API;

function apiBase(){ return apiInput.value.trim().replace(/\/+$/,''); }
function v(id){return document.getElementById(id).value.trim()}
function n(id){const x=parseFloat(v(id));return Number.isFinite(x)?x:0}
function setStatus(id,msg,ok=false){const el=document.getElementById(id);el.textContent=msg;el.className='status '+(ok?'ok':'bad')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function request(path, options={}){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  if(token) headers.Authorization='Bearer '+token;
  const r=await fetch(apiBase()+path,{...options,headers});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{data={raw:text}}
  if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}

async function checkServer(){
  try{
    const d=await request('/api/health',{headers:{}});
    setStatus('loginStatus','SERVER OK\\n'+JSON.stringify(d,null,2),true);
  }catch(e){setStatus('loginStatus','SERVER CHECK FAILED\\n'+e.message)}
}

async function login(){
  try{
    const username=v('username'), password=v('password');
    if(!password) throw new Error('Password দিন');
    const d=await request('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});
    token=d.token;
    sessionStorage.setItem('shivam_token',token);
    sessionStorage.setItem('shivam_api',apiBase());
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('appCard').classList.remove('hidden');
    document.getElementById('who').textContent='Logged in: '+(d.user?.name||username)+' ('+(d.user?.role||'')+')';
    setStatus('appStatus','Cloud connection successful.',true);
    await loadDashboard();
  }catch(e){setStatus('loginStatus','LOGIN FAILED\\n'+e.message)}
}

function logout(){
  token='';sessionStorage.removeItem('shivam_token');
  document.getElementById('appCard').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  setStatus('loginStatus','Logged out.');
}

async function loadDashboard(){
  try{
    const d=await request('/api/dashboard');
    for(const [id,key] of [['mSales','sales'],['mPaid','paid'],['mOutstanding','outstanding'],['mExpense','expense'],['mProfit','profit']])
      document.getElementById(id).textContent='₹ '+Number(d[key]||0).toLocaleString('en-IN');
  }catch(e){setStatus('appStatus','Dashboard error: '+e.message)}
}

function showTab(id){
  document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id!=='dashboard') loadTable(id);
  else loadDashboard();
}

async function loadTable(resource){
  try{
    const rows=await request('/api/'+resource);
    const el=document.getElementById(resource+'Table');
    if(!rows.length){el.innerHTML='<p class="small">No records yet.</p>';return}
    const keys=Object.keys(rows[0]);
    el.innerHTML='<div style="overflow:auto"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+
      rows.slice(0,100).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+
      '</tbody></table></div>';
  }catch(e){document.getElementById(resource+'Table').innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}
}

async function addRecord(resource,payload){
  try{
    await request('/api/'+resource,{method:'POST',body:JSON.stringify(payload)});
    setStatus('appStatus',resource+' saved successfully.',true);
    await loadTable(resource);
    if(resource==='invoices'||resource==='payments'||resource==='expenses') await loadDashboard();
  }catch(e){setStatus('appStatus','Save failed: '+e.message)}
}

if(token){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('appCard').classList.remove('hidden');
  request('/api/me').then(d=>{
    document.getElementById('who').textContent='Logged in: '+(d.user?.name||'Admin')+' ('+(d.user?.role||'')+')';
    setStatus('appStatus','Session restored.',true);loadDashboard();
  }).catch(()=>logout());
}
</script>
</body>
</html>
